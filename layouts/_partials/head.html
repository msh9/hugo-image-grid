<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ if .Title }}{{ .Title }} ·{{ end }}{{ site.Title }}</title>
  <link
    rel="stylesheet"
    href="{{ (resources.Get "css/theme.css" | resources.Minify).Permalink }}"
  />
  <link
    rel="stylesheet"
    href="{{ (resources.Get "css/lightbox.min.css").Permalink }}"
  />
  {{- with site.Params.description -}}
    <meta name="description" content="{{ . }}" />
  {{- end -}}
  <script type="module">
    import lightbox from "{{ (resources.Get "js/lightbox-jquery.module.min.js").Permalink }}";
    lightbox.init();
  </script>
  {{ partial "head-custom.html" . }}
</head>
